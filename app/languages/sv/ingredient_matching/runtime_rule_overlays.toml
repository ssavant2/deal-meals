# CLI-managed Track A runtime-rule overlays.
#
# This file is tracked production source. Add entries through:
#   ./bin/dm matcher add pnb|fpb|ksbc ...
#
# New CLI entries use id/status metadata. Statusless entries are treated as active
# only for backwards compatibility; do not append statusless rows manually.
#
# Supported sections:
#   [[product_name_blockers]]
#   [[false_positive_blockers]]
#   [[keyword_suppressed_by_context]]
#   [[space_normalizations]]
#   [[keyword_set_updates]]
#   [[carrier_set_updates]]
#   [[cuisine_context]]
#   [[compound_protection_updates]]
#   [[specialty_qualifiers]]
#   [[qualifier_equivalents]]

[[product_name_blockers]]
keyword = "rom"
blockers = ["sikrom"]
reason = "Sikrom (white-fish roe) is not rum or rum-aroma; recipes wanting sikrom use compound keyword"

[[product_name_blockers]]
keyword = "spannmål"
blockers = ["entrecote", "uppfödd", "gräs", "oxfilé", "kött", "nötkött", "nötfärs", "fläsk", "kyckling", "lamm", "kalvkött"]
reason = "Meat products are 'uppfödd på gräs och spannmål' (grass-fed and grain-fed) — spannmål describes the animal feed, not a cooking ingredient. Spannmål as recipe ingredient means a carbohydrate base (rice/oats/wheat), not meat."

[[false_positive_blockers]]
id = "runtime_fpb_ingefara"
status = "active"
keyword = "ingefära"
blockers = ["balsamico", "balsamicoingefara", "balsamicoingefära"]
reason = "Crema di Balsamico Ingefära is a condiment — space-norm merges it to balsamicoingefara compound before FPB check, so both plain and compound forms needed as blockers"
