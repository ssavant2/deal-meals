# CLI-managed Track A runtime-rule overlays.
#
# This file is tracked production source. Add entries through:
#   ./bin/dm matcher add pnb|fpb|ksbc ...
#
# New CLI entries use id/status metadata. Statusless entries are treated as active
# only for backwards compatibility; do not append statusless rows manually.
#
# Supported sections:
#   [[product_name_blockers]]
#   [[false_positive_blockers]]
#   [[keyword_suppressed_by_context]]
#   [[space_normalizations]]
#   [[keyword_set_updates]]
#   [[carrier_set_updates]]
#   [[cuisine_context]]
#   [[compound_protection_updates]]
#   [[specialty_qualifiers]]
#   [[qualifier_equivalents]]

[[product_name_blockers]]
keyword = "rom"
blockers = ["sikrom"]
reason = "Sikrom (white-fish roe) is not rum or rum-aroma; recipes wanting sikrom use compound keyword"

[[product_name_blockers]]
keyword = "spannmål"
blockers = ["entrecote", "uppfödd", "gräs", "oxfilé", "kött", "nötkött", "nötfärs", "fläsk", "kyckling", "lamm", "kalvkött"]
reason = "Meat products are 'uppfödd på gräs och spannmål' (grass-fed and grain-fed) — spannmål describes the animal feed, not a cooking ingredient. Spannmål as recipe ingredient means a carbohydrate base (rice/oats/wheat), not meat."

[[product_name_blockers]]
id = "runtime_pnb_cappuccino"
status = "active"
keyword = "cappuccino"
blockers = ["karamell", "kopiko"]
reason = "Kopiko Cappuccino Karamell is a coffee-flavored candy — it should not match cappuccino-flavor protein drink recipes"

[[product_name_blockers]]
id = "runtime_pnb_pollock"
status = "active"
keyword = "pollock"
blockers = ["panerad", "panerade", "sprodpanerad", "sprödpanerad"]
reason = "Panerad Alaska pollock is a fish finger / breaded fillet product — raw pollock recipes need unprocessed fish, not breaded ready-meal products. Same pattern as torsk PNB."

[[false_positive_blockers]]
id = "runtime_fpb_ingefara"
status = "active"
keyword = "ingefära"
blockers = ["balsamico", "balsamicoingefara", "balsamicoingefära"]
reason = "Crema di Balsamico Ingefära is a condiment — space-norm merges it to balsamicoingefara compound before FPB check, so both plain and compound forms needed as blockers"

[[false_positive_blockers]]
id = "runtime_fpb_bitter"
status = "active"
keyword = "bitter"
blockers = ["bittermandel"]
reason = "Tonic Bitter drink extracts 'bitter' which prefix-matches 'bittermandel' recipes — bitterness beverages are not bitter almonds"

[[false_positive_blockers]]
id = "runtime_fpb_korsbar"
status = "active"
keyword = "körsbär"
blockers = ["körsbärssylt"]
reason = "Smart-blocker allows körsbär when it appears as a prefix in compound 'körsbärssylt' — compound form needed explicitly so startswith check blocks it"

[[keyword_suppressed_by_context]]
id = "runtime_ksbc_ingefara"
status = "active"
keyword = "ingefära"
context = ["kombucha"]
reason = "Kombucha ingredient 'med ingefära' describes the kombucha flavor — fresh ginger products should not match a kombucha cocktail ingredient"
